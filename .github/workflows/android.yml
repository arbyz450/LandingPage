name: Android APK

on:
  push:
    paths:
      - "cr-stockfish/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:   # run it by hand (Actions tab -> Android APK -> Run workflow) to bundle the latest engine

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a host Python ("buildPython") to resolve pip wheels at build time.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: cr-stockfish/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: cr-stockfish-debug-apk
          path: cr-stockfish/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
